when:
  - event: push
    branch: main
  - event: manual
    branch: main

steps:
  - name: CHECK
    image: 127.0.0.1:5000/woodpecker-job:v0.0.10
    commands:
      - . /entrypoint.sh
      - nix develop --command just check

  - name: AUTO_TAG
    image: alpine/git:latest
    environment:
      CODEBERG_TOKEN:
        from_secret: codeberg_token
    commands:
      - git remote set-url origin "https://token:$${CODEBERG_TOKEN}@codeberg.org/$${CI_REPO}.git"
      - VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
      - TAG="v$VERSION"
      - |
        if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
          echo "Tag $TAG already exists on remote, skipping"
        else
          echo "Creating tag $TAG"
          git tag "$TAG"
          git push origin "$TAG"
        fi
