[package]
name = "claude-statusline"
version = "0.3.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.43", features = ["serde"] }
color-eyre = "0.6.5"
console = "0.16.2"
dirs = "6.0.0"
num-traits = "0.2.19"
owo-colors = "4.2.3"
reqwest = { version = "0.13.1", default-features = false, features = [
  "blocking",
  "http2",
  "json",
  "rustls-no-provider",
] }
rustls = { version = "0.23.37", default-features = false, features = [
  "ring",
  "logging",
  "std",
  "tls12",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["rt", "macros"] }

[lints.rust]
future_incompatible = "forbid"
keyword_idents = "forbid"
let_underscore = "forbid"
nonstandard_style = { level = "deny", priority = -1 }
refining_impl_trait = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = "forbid"
unsafe_code = "forbid"
unused = { level = "deny", priority = -1 }
warnings = "deny"

[lints.clippy]
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
restriction = { level = "deny", priority = -1 }

# all projects
absolute_paths = "allow"
arithmetic_side_effects = "allow"
blanket_clippy_restriction_lints = "allow"
cargo_common_metadata = "allow"
error_impl_error = "allow"
exhaustive_structs = "allow"
expect_used = "allow"
implicit_return = "allow"
missing_const_for_fn = "allow"
missing_docs_in_private_items = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
mod_module_files = "allow"
multiple_crate_versions = "allow"
option_if_let_else = "allow"
pattern_type_mismatch = "allow"
question_mark_used = "allow"
separated_literal_suffix = "allow"
shadow_reuse = "allow"
single_call_fn = "allow"
std_instead_of_alloc = "allow"
std_instead_of_core = "allow"
str_to_string = "allow"
struct_excessive_bools = "allow"

# this project
print_stderr = "allow"

[profile.release]
codegen-units = 1
lto = true

[dev-dependencies]
assert_cmd = "2.1.2"
filetime = "0.2.27"
predicates = "3.1.3"
tempfile = "3.24.0"
