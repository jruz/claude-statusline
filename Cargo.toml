[package]
name = "claude-statusline"
version = "0.4.4"
edition = "2024"
license = "EUPL-1.2+"

[dependencies]
chrono = { version = "=0.4.45", features = ["serde"] }
color-eyre = "=0.6.5"
console = "=0.16.6"
dirs = "=7.0.0"
num-traits = "=0.2.19"
owo-colors = "=4.4.0"
reqwest = { version = "=0.13.5", default-features = false, features = [
  "blocking",
  "http2",
  "json",
  "rustls-no-provider",
] }
rustls = { version = "=0.23.46", default-features = false, features = [
  "ring",
  "logging",
  "std",
  "tls12",
] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"

[lints.rust]
future_incompatible = "forbid"
keyword_idents = "forbid"
let_underscore = "forbid"
nonstandard_style = { level = "deny", priority = -1 }
refining_impl_trait = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = "forbid"
unsafe_code = "forbid"
unused = { level = "deny", priority = -1 }
warnings = "deny"

[build-dependencies]
thiserror = "=2.0.21"

[lints.clippy]
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
restriction = { level = "deny", priority = -1 }

# all projects
absolute_paths = "allow"
arithmetic_side_effects = "allow"
blanket_clippy_restriction_lints = "allow"
cargo_common_metadata = "allow"
error_impl_error = "allow"
exhaustive_structs = "allow"
expect_used = "allow"
implicit_return = "allow"
missing_const_for_fn = "allow"
missing_docs_in_private_items = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
mod_module_files = "allow"
multiple_crate_versions = "allow"
option_if_let_else = "allow"
pattern_type_mismatch = "allow"
question_mark_used = "allow"
separated_literal_suffix = "allow"
shadow_reuse = "allow"
single_call_fn = "allow"
std_instead_of_alloc = "allow"
std_instead_of_core = "allow"
str_to_string = "allow"
struct_excessive_bools = "allow"

# this project
print_stderr = "allow"
exhaustive_enums = "allow"
missing_inline_in_public_items = "allow"
rest_pattern_accessible_field = "allow"
print_stdout = "allow"
tests_outside_test_module = "allow"

[profile.release]
codegen-units = 1
lto = true

[dev-dependencies]
assert_cmd = "=2.2.2"
filetime = "=0.2.29"
predicates = "=3.1.4"
tempfile = "=3.27.0"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.fast]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
incremental = true
