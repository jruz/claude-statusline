[package]
name = "claude-statusline"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
color-eyre = "0.6.5"
console = "0.16.2"
dirs = "6.0.0"
owo-colors = "4"
reqwest = { version = "0.13.1", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
tokio = { version = "1.49.0", features = ["rt", "macros"] }

[lints.rust]
dead_code = { level = "allow", priority = 1 }
future_incompatible = "forbid"
keyword_idents = "forbid"
let_underscore = "forbid"
nonstandard_style = { level = "deny", priority = -1 }
refining_impl_trait = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = "forbid"
unsafe_code = "forbid"
unused = { level = "deny", priority = -1 }
warnings = "deny"

[lints.clippy]
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
restriction = { level = "deny", priority = -1 }

# all projects
absolute_paths = "allow"
arithmetic_side_effects = "allow"
as_conversions = "allow"
blanket_clippy_restriction_lints = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cargo_common_metadata = "allow"
error_impl_error = "allow"
expect_used = "allow"
float_arithmetic = "allow"
implicit_return = "allow"
integer_division_remainder_used = "allow"
missing_const_for_fn = "allow"
modulo_arithmetic = "allow"
missing_docs_in_private_items = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
mod_module_files = "allow"
multiple_crate_versions = "allow"
pattern_type_mismatch = "allow"
question_mark_used = "allow"
shadow_reuse = "allow"
single_call_fn = "allow"
std_instead_of_alloc = "allow"
std_instead_of_core = "allow"
str_to_string = "allow"
struct_excessive_bools = "allow"

# this project
print_stdout = "allow"

[profile.release]
codegen-units = 1
lto = true

[dev-dependencies]
assert_cmd = "2.1.2"
